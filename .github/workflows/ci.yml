# ci.yml: Lint, Test and Image on pull requests and on main. Lint and Test are
# the status checks main's branch protection requires.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

env:
  GOPRIVATE: github.com/AnqorDX/*,github.com/virtual-db/*
  HAS_TOKEN: ${{ secrets.VDB_CI_TOKEN != '' }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Access private modules
        if: env.HAS_TOKEN == 'true'
        run: git config --global url."https://x-access-token:${{ secrets.VDB_CI_TOKEN }}@github.com/".insteadOf "https://github.com/"
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - name: vet
        run: go vet ./...
      - name: generated protocol is current
        run: |
          make proto
          git diff --exit-code protocol/vdb.pb.go

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Access private modules
        if: env.HAS_TOKEN == 'true'
        run: git config --global url."https://x-access-token:${{ secrets.VDB_CI_TOKEN }}@github.com/".insteadOf "https://github.com/"
      - name: test
        run: go test -race ./...

  image:
    name: Image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - name: Build the Go stage (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: go
          push: false
          secrets: |
            gh_token=${{ secrets.VDB_CI_TOKEN }}
