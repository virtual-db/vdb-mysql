# ci.yml: Lint, Test and Image on pull requests (plan doc 14 §4). They do not
# run again on the merge to main: main only receives pull requests that passed.
# Lint and Test are the status checks main's branch protection requires.
name: CI

on:
  pull_request:

# A new push to a pull request cancels that pull request's run still in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  CACHE: ghcr.io/virtual-db/vdb-mysql-buildcache

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - name: vet
        run: |
          go vet ./...
          cd oracle && go vet ./...

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: build
        run: go build ./...
      - name: oracle unit tests
        working-directory: oracle
        run: go test -race ./...

  image:
    name: Image
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The build cache lives in GHCR (CACHE, see release.yml), not the Actions
      # cache: it never expires, so the mysqld build, pinned by MYSQL_RELEASE and
      # PLUGINS_REF, compiles once. Pull requests from forks only read it.
      - name: Build the image (no push)
        run: |
          to=()
          if [ "${{ github.event.pull_request.head.repo.full_name }}" = "${{ github.repository }}" ]; then
            to=(--cache-to "type=registry,ref=$CACHE:release-amd64,mode=max")
          fi
          docker buildx build . --target runtime --cache-from "type=registry,ref=$CACHE:release-amd64" "${to[@]}"
