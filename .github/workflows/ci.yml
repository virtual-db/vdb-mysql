name: CI

on:
  push:
  pull_request:

env:
  GONOSUMDB: github.com/AnqorDX/*,github.com/virtual-db/*

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - name: vet
        run: go vet ./...
      - name: test
        run: go test -race ./...
      - name: generated protocol is current
        run: |
          make proto
          git diff --exit-code protocol/vdb.pb.go
  image:
    name: Image (no push)
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - name: Build
        run: docker build --target go .
