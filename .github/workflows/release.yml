# release.yml: the one release path (plan doc 14 §5, D-91). A tag vX.Y.Z builds
# the image from source, runs the oracle against that exact image, and only if
# it passes publishes it and a GitHub release:
#   ghcr.io/virtual-db/vdb-mysql:vX.Y.Z   (+ vX.Y and latest for stable tags)
#   ghcr.io/virtual-db/vdb-mysql:vX.Y.Z-debug
# and the same tags on registry.vdbm.io when VDBM_REGISTRY_TOKEN is set.
name: Release

on:
  push:
    tags:
      - 'v*.*.*'

env:
  GHCR_IMAGE: ghcr.io/${{ github.repository }}
  VDBM_IMAGE: registry.vdbm.io/${{ github.repository }}

jobs:
  oracle:
    name: Oracle
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v6
      - name: Free disk space for the mysqld build
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true
      - uses: docker/setup-buildx-action@v3
      - name: Build the image and the reference
        run: |
          docker buildx build . --target runtime --build-arg VARIANT=debug --build-arg VERSION=${{ github.ref_name }} \
            --cache-from type=gha --cache-to type=gha,mode=max --load -t vdb-mysql:candidate
          docker buildx build . --target reference --build-arg VARIANT=debug \
            --cache-from type=gha --load -t vdb-mysql:reference
      - uses: actions/setup-go@v5
        with:
          go-version-file: oracle/go.mod
      - name: Oracle against the built image
        working-directory: oracle
        env:
          VDB_IMAGE: vdb-mysql:candidate
          REFERENCE_IMAGE: vdb-mysql:reference
        run: ./run.sh -seeds-file seeds.txt
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with: { name: oracle-logs, path: oracle/out/, retention-days: 14 }

  publish:
    name: Publish
    needs: oracle
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: write
      packages: write
    env:
      HAS_VDBM: ${{ secrets.VDBM_REGISTRY_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v6
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/login-action@v3
        if: env.HAS_VDBM == 'true'
        with:
          registry: registry.vdbm.io
          username: ${{ secrets.VDBM_REGISTRY_TOKEN }}
          password: ${{ secrets.VDBM_REGISTRY_TOKEN }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Image names
        id: names
        run: |
          if [ "$HAS_VDBM" = true ]; then printf 'images<<E\n%s\n%s\nE\n' "$GHCR_IMAGE" "$VDBM_IMAGE"; else printf 'images=%s\n' "$GHCR_IMAGE"; fi >> "$GITHUB_OUTPUT"
      - name: Tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.names.outputs.images }}
          tags: |
            type=ref,event=tag
            type=semver,pattern=v{{major}}.{{minor}},enable=${{ !contains(github.ref_name, '-') }}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
      - name: Release variant
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          build-args: |
            VERSION=${{ github.ref_name }}
      - name: Debug variant
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ env.GHCR_IMAGE }}:${{ github.ref_name }}-debug
          cache-from: type=gha
          build-args: |
            VERSION=${{ github.ref_name }}
            VARIANT=debug
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
