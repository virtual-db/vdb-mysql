name: Release

on:
  push:
    tags:
      - 'v*.*.*'

env:
  GONOSUMDB: github.com/AnqorDX/*,github.com/virtual-db/*

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test
        run: go test -race ./...

  release:
    name: GitHub Release
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # The binary is no longer attached: vdb-mysql is useful only in the image (D-13).
      - uses: softprops/action-gh-release@v2
