# release.yml: the one release path (plan doc 14 §5, D-91). Tags are plain git
# tags; publishing a GitHub release for a tag vX.Y.Z builds the production image
# once per platform, runs the oracle against exactly that image, and only if
# every platform passes publishes it:
#   ghcr.io/virtual-db/vdb-mysql:vX.Y.Z   (+ vX.Y and latest for stable tags)
# and the same tags on registry.vdbm.io when VDBM_REGISTRY_TOKEN is set.
# Releases build and test the production variant only; debug builds
# (VARIANT=debug) are a local tool.
#
# Build once, test, promote: each platform builds on a native runner (no QEMU)
# and pushes its image by digest only, untagged. The oracle runs against that
# digest. Publish builds nothing: it tags a multi-platform index of the tested
# digests. A failed release leaves only untagged images behind.
#
# Build cache: ghcr.io/virtual-db/vdb-mysql-buildcache, one tag per platform:
#   release-amd64  also written by CI's Image check (same-repo PRs)
#   release-arm64  written here
# Registry cache does not expire, so the mysqld build compiles once per
# MySQL release, plug-in build scripts and platform.
name: Release

on:
  release:
    types: [published]

env:
  GHCR_IMAGE: ghcr.io/${{ github.repository }}
  VDBM_IMAGE: registry.vdbm.io/${{ github.repository }}
  CACHE: ghcr.io/virtual-db/vdb-mysql-buildcache

jobs:
  oracle:
    name: Oracle (${{ matrix.arch }})
    if: startsWith(github.event.release.tag_name, 'v')
    strategy:
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    permissions:
      contents: read
      packages: write
    steps:
      - name: Free disk space for the mysqld build
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker system prune -af
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build the production image and push it by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          target: runtime
          platforms: linux/${{ matrix.arch }}
          build-args: VERSION=${{ github.ref_name }}
          outputs: type=image,name=${{ env.GHCR_IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=registry,ref=${{ env.CACHE }}:release-${{ matrix.arch }}
          cache-to: type=registry,ref=${{ env.CACHE }}:release-${{ matrix.arch }},mode=max
      - name: Build the reference
        run: |
          docker buildx build . --target reference \
            --cache-from type=registry,ref=$CACHE:release-${{ matrix.arch }} --load -t vdb-mysql:reference
      - uses: actions/setup-go@v7
        with:
          go-version-file: oracle/go.mod
      - name: Oracle against the pushed image
        working-directory: oracle
        env:
          VDB_IMAGE: ${{ env.GHCR_IMAGE }}@${{ steps.build.outputs.digest }}
          REFERENCE_IMAGE: vdb-mysql:reference
        run: ./run.sh -seeds-file seeds.txt
      - uses: actions/upload-artifact@v7
        if: ${{ always() }}
        with: { name: oracle-logs-${{ matrix.arch }}, path: oracle/out/, retention-days: 14 }
      - name: Record the tested digest
        run: |
          mkdir -p digests
          echo "${{ steps.build.outputs.digest }}" > digests/${{ matrix.arch }}
      - uses: actions/upload-artifact@v7
        with: { name: digest-${{ matrix.arch }}, path: digests/, retention-days: 1 }

  publish:
    name: Publish
    needs: oracle
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    env:
      HAS_VDBM: ${{ secrets.VDBM_REGISTRY_TOKEN != '' }}
    steps:
      - uses: actions/download-artifact@v8
        with: { pattern: digest-*, path: digests, merge-multiple: true }
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/login-action@v4
        if: env.HAS_VDBM == 'true'
        with:
          registry: registry.vdbm.io
          username: ${{ secrets.VDBM_REGISTRY_TOKEN }}
          password: ${{ secrets.VDBM_REGISTRY_TOKEN }}
      - name: Image names
        id: names
        run: |
          if [ "$HAS_VDBM" = true ]; then printf 'images<<E\n%s\n%s\nE\n' "$GHCR_IMAGE" "$VDBM_IMAGE"; else printf 'images=%s\n' "$GHCR_IMAGE"; fi >> "$GITHUB_OUTPUT"
      - name: Tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.names.outputs.images }}
          tags: |
            type=ref,event=tag
            type=semver,pattern=v{{major}}.{{minor}},enable=${{ !contains(github.ref_name, '-') }}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
      - name: Tag the tested digests as one multi-platform image
        run: |
          tags=$(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          srcs=$(for f in digests/*; do printf '%s@%s ' "$GHCR_IMAGE" "$(cat "$f")"; done)
          docker buildx imagetools create $tags $srcs
          docker buildx imagetools inspect "$GHCR_IMAGE:${{ github.ref_name }}"
