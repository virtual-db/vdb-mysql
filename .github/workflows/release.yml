# release.yml: the one release path (plan doc 14 §5, D-91). Tags are plain git
# tags; publishing a GitHub release for a tag vX.Y.Z builds the image from
# source, runs the oracle against that production image, and only if it passes
# publishes it:
#   ghcr.io/virtual-db/vdb-mysql:vX.Y.Z   (+ vX.Y and latest for stable tags)
# and the same tags on registry.vdbm.io when VDBM_REGISTRY_TOKEN is set.
# Releases build and test the production variant only; debug builds
# (VARIANT=debug) are a local tool.
#
# Build cache: ghcr.io/virtual-db/vdb-mysql-buildcache, one tag per build shape,
# so builds never overwrite each other's cache:
#   release-amd64  CI's Image check (written by same-repo PRs); the
#                  oracle's candidate and the published amd64 image reuse it
#   release        the published multi-arch image
# Registry cache does not expire, so the mysqld build compiles once per
# MYSQL_RELEASE / PLUGINS_REF / platform.
name: Release

on:
  release:
    types: [published]

env:
  GHCR_IMAGE: ghcr.io/${{ github.repository }}
  VDBM_IMAGE: registry.vdbm.io/${{ github.repository }}
  CACHE: ghcr.io/virtual-db/vdb-mysql-buildcache

jobs:
  oracle:
    name: Oracle
    if: startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - name: Free disk space for the mysqld build
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build the production image and the reference
        run: |
          docker buildx build . --target runtime --build-arg VERSION=${{ github.ref_name }} \
            --cache-from type=registry,ref=$CACHE:release-amd64 --load -t vdb-mysql:candidate
          docker buildx build . --target reference \
            --cache-from type=registry,ref=$CACHE:release-amd64 --load -t vdb-mysql:reference
      - uses: actions/setup-go@v5
        with:
          go-version-file: oracle/go.mod
      - name: Oracle against the built image
        working-directory: oracle
        env:
          VDB_IMAGE: vdb-mysql:candidate
          REFERENCE_IMAGE: vdb-mysql:reference
        run: ./run.sh -seeds-file seeds.txt
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with: { name: oracle-logs, path: oracle/out/, retention-days: 14 }

  publish:
    name: Publish
    needs: oracle
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read
      packages: write
    env:
      HAS_VDBM: ${{ secrets.VDBM_REGISTRY_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v6
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/login-action@v3
        if: env.HAS_VDBM == 'true'
        with:
          registry: registry.vdbm.io
          username: ${{ secrets.VDBM_REGISTRY_TOKEN }}
          password: ${{ secrets.VDBM_REGISTRY_TOKEN }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Image names
        id: names
        run: |
          if [ "$HAS_VDBM" = true ]; then printf 'images<<E\n%s\n%s\nE\n' "$GHCR_IMAGE" "$VDBM_IMAGE"; else printf 'images=%s\n' "$GHCR_IMAGE"; fi >> "$GITHUB_OUTPUT"
      - name: Tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.names.outputs.images }}
          tags: |
            type=ref,event=tag
            type=semver,pattern=v{{major}}.{{minor}},enable=${{ !contains(github.ref_name, '-') }}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
      - name: Production image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: |
            type=registry,ref=${{ env.CACHE }}:release
            type=registry,ref=${{ env.CACHE }}:release-amd64
          cache-to: type=registry,ref=${{ env.CACHE }}:release,mode=max
          build-args: |
            VERSION=${{ github.ref_name }}
